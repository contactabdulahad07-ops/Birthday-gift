<!index html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Falak!</title>
    <!-- Google Fonts for a romantic feel -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff758c;
            --secondary-purple: #764ba2;
            --accent-pink: #ff7eb3;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            overflow-x: hidden;
            color: #4a4a4a;
            min-height: 100vh;
        }

        /* --- Floating Elements --- */
        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart, .balloon {
            position: absolute;
            bottom: -100px;
            animation: float Up 10s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .hero h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: var(--secondary-purple);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            animation: fadeInDown 1.5s ease-out;
        }

        .hero p {
            font-size: 1.5rem;
            color: #d63384;
            margin-bottom: 30px;
        }

        /* --- Countdown Timer --- */
        .countdown {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .time-box {
            text-align: center;
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--secondary-purple);
        }

        .time-box label {
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* --- Animated Gift Box --- */
        .gift-section {
            padding: 50px 20px;
            text-align: center;
            background: white;
            border-radius: 50px 50px 0 0;
            position: relative;
            z-index: 1;
        }

        .gift-container {
            display: inline-block;
            cursor: pointer;
            position: relative;
            margin: 50px 0;
            transition: transform 0.3s;
        }

        .gift-box {
            width: 150px;
            height: 150px;
            background: var(--primary-pink);
            position: relative;
            border-radius: 5px;
        }

        .gift-box::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 100%;
            background: rgba(0,0,0,0.1);
            left: 60px;
        }

        .gift-lid {
            width: 170px;
            height: 40px;
            background: var(--accent-pink);
            position: absolute;
            top: -20px;
            left: -10px;
            border-radius: 5px;
            transition: 0.5s;
            z-index: 2;
        }

        .gift-container:hover .gift-lid {
            transform: translateY(-40px) rotate(-10deg);
        }

        #surprise-message {
            display: none;
            font-size: 1.2rem;
            color: var(--secondary-purple);
            margin-top: 20px;
            animation: heartBeat 1s infinite;
        }

        /* --- Photo Gallery --- */
        .gallery {
            padding: 50px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05) rotate(2deg);
        }

        /* --- Music Toggle --- */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: var(--secondary-purple);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .hero h1 { font-size: 3rem; }
            .countdown { gap: 10px; padding: 15px; }
            .time-box span { font-size: 1.5rem; }
            .gallery { grid-template-columns: 1fr; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Floating Background -->
    <div class="floating-container" id="bg-animation"></div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <button class="music-control" onclick="toggleMusic()">🎵 Play Music</button>

    <!-- Main Content -->
    <section class="hero">
        <h1>Happy Birthday Falak!</h1>
        <p>Thinking of you on your special day...</p>

        <div class="countdown" id="countdown">
            <div class="time-box"><span id="days">00</span><label>Days</label></div>
            <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Mins</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Secs</label></div>
        </div>

        <p style="font-size: 1rem; opacity: 0.8;">Countdown to September 11th</p>
    </section>

    <section class="gift-section">
        <h2 style="font-family: 'Dancing Script'; font-size: 2.5rem; color: var(--secondary-purple);">A Surprise for You!</h2>
        <div class="gift-container" onclick="openGift()">
            <div class="gift-lid"></div>
            <div class="gift-box"></div>
        </div>
        <div id="surprise-message">
            💖 "You are the most beautiful star in the sky, Falak. May your year be as bright as your smile!" 💖
        </div>

        <h2 style="font-family: 'Dancing Script'; margin-top: 80px; font-size: 2.5rem; color: var(--secondary-purple);">Our Precious Moments</h2>
        <div class="gallery">
            <!-- Replace these placeholder URLs with your actual photos -->
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500" alt="Birthday decoration">
            <img src="https://images.unsplash.com/photo-1530103862676-fa8c91abeaba?w=500" alt="Balloons">
            <img src="https://images.unsplash.com/photo-1464349153735-7db50ed83c84?w=500" alt="Cake">
            <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=500" alt="Gift">
        </div>
        
        <footer style="margin-top: 50px; padding-bottom: 20px; font-size: 0.8rem; color: #888;">
            Made with ❤️ for Falak
        </footer>
    </section>

    <script>
        // --- Floating Hearts and Balloons ---
        function createFloatingElement() {
            const container = document.getElementById('bg-animation');
            const el = document.createElement('div');
            const isHeart = Math.random() > 0.5;
            
            el.innerHTML = isHeart ? '❤️' : '🎈';
            el.className = isHeart ? 'heart' : 'balloon';
            
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 20 + 20) + 'px';
            el.style.animationDuration = (Math.random() * 5 + 5) + 's';
            el.style.opacity = Math.random();
            
            container.appendChild(el);
            
            setTimeout(() => {
                el.remove();
            }, 10000);
        }

        setInterval(createFloatingElement, 500);

        // --- Countdown Timer ---
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let birthday = new Date(`September 11, ${currentYear} 00:00:00`);

            // If birthday already passed this year, countdown to next year
            if (now > birthday) {
                birthday = new Date(`September 11, ${currentYear + 1} 00:00:00`);
            }

            const diff = birthday - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- Gift Reveal ---
        function openGift() {
            document.getElementById('surprise-message').style.display = 'block';
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.play();
                document.querySelector('.music-control').innerText = "🎵 Mute Music";
            }
            alert("Happy Birthday Falak! 🌸");
        }

        // --- Music Toggle ---
        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            const btn = document.querySelector('.music-control');
            if (audio.paused) {
                audio.play();
                btn.innerText = "🎵 Mute Music";
            } else {
                audio.pause();
                btn.innerText = "🎵 Play Music";
            }
        }
    </script>
</body>
</html>
